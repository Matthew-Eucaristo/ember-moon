<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Moon Iai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&text=%E7%84%94%E6%9C%88%E5%B1%85%E5%90%88%E3%83%BB%E8%A3%82%E6%AE%8B%E5%BF%83%E9%9B%B6%E9%9D%99%E5%A3%B1%E6%8A%9C%E5%88%80%E5%BC%90%E4%B8%80%E9%96%83%E5%8F%82%E7%9C%BC%E8%82%86%E6%B8%A6%E4%BC%8D%E7%B4%8D%E9%99%B8&display=swap" rel="stylesheet">
<style>
:root {
  --night: #09060a;
  --paper: #ece8df;
  --vermilion: #de381a;
  --ember: #ff8a2a;
  --chrome: rgba(14, 10, 12, 0.74);
  --line: rgba(255, 236, 214, 0.12);
  --text: #f3ede4;
  --muted: rgba(243, 237, 228, 0.58);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
  /* layout: one full-bleed 16:9 canvas stage, a floating transport bar pinned to the bottom edge */
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--font-mono);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
body.idle canvas { cursor: none; }
.ui {
  position: fixed;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: min(760px, calc(100% - 32px));
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--chrome);
  border: 1px solid var(--line);
  border-radius: 14px;
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  transition: opacity .35s ease, transform .35s ease;
}
body.idle .ui:not(:focus-within) { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
.ui button {
  flex: none;
  height: 34px;
  min-width: 34px;
  padding: 0 8px;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  border-radius: 9px;
  color: var(--text);
  font: 500 12px/1 var(--font-mono);
  letter-spacing: .04em;
  cursor: pointer;
}
.ui button:hover { background: rgba(255, 255, 255, .07); }
.ui button:focus-visible, .ui input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.ui button[aria-pressed="true"] { color: var(--ember); }
.ui svg { width: 18px; height: 18px; fill: currentColor; }
.track { position: relative; flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks span { position: absolute; top: 9px; width: 1px; height: 16px; background: var(--muted); opacity: .45; }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 34px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  position: relative;
}
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(to right, var(--ember) var(--p, 0%), rgba(255,255,255,.18) var(--p, 0%)); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 2px; background: rgba(255,255,255,.18); border-radius: 2px; }
input[type="range"]::-moz-range-progress { height: 2px; background: var(--ember); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--text); border: 0; box-shadow: 0 0 0 3px rgba(255,138,42,.35); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 0; }
.tc { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
@media (max-width: 520px) {
  .ui { gap: 4px; padding: 6px 8px; }
  .tc { display: none; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Animated katana iaijutsu sequence: a sheathed blade is drawn, cuts open a rift that reveals a burning eye, and is sheathed again." role="img"></canvas>
<div class="ui" id="ui">
  <button id="restart" type="button" aria-label="Restart from the beginning"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 18 5.5v13z"/></svg></button>
  <button id="play" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
  <div class="track">
    <div class="ticks" id="ticks"></div>
    <input id="scrub" type="range" min="0" max="14630" step="1" value="0" aria-label="Timeline position">
  </div>
  <span class="tc" id="tc">00:00:00</span>
  <button id="speed" type="button" aria-label="Playback speed">1×</button>
  <button id="sound" type="button" aria-label="Sound" aria-pressed="false"><svg viewBox="0 0 24 24" id="soundIcon"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m16 9 5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></button>
</div>
<script>
(() => {
"use strict";
const W = 1920, H = 1080, T = 14.63, FPS = 24;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inC: x => x * x * x,
  outC: x => 1 - Math.pow(1 - x, 3),
  ioC: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outX: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  ioS: x => x * x * (3 - 2 * x),
  outB: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  ioB: x => { const c2 = 1.70158 * 1.525; return x < .5 ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2 : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2; }
};
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const noise2 = (x, y) => {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const h = (a, b) => hash(a * 57.0 + b * 131.0);
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h(ix, iy), h(ix + 1, iy), ux), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), ux), uy);
};
const C = {
  paper: [236, 232, 223], ink: [19, 15, 18], night: [9, 6, 8], verm: [222, 56, 26],
  ember: [255, 128, 40], hot: [255, 238, 210], gold: [214, 166, 74], blood: [112, 16, 10]
};
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let dpr = 1, fit = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  fit = Math.min(w / W, h / H);
  ox = (w - W * fit) / 2; oy = (h - H * fit) / 2;
}
addEventListener("resize", resize);
resize();

/* ---------- static assets ---------- */
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
const grainTile = (() => {
  const c = makeCanvas(192, 192), g = c.getContext("2d"), r = rng(3);
  g.strokeStyle = "rgba(60,40,30,.075)"; g.lineWidth = 1;
  for (let i = 0; i <= 192; i += 48) { g.beginPath(); g.moveTo(i + .5, 0); g.lineTo(i + .5, 192); g.moveTo(0, i + .5); g.lineTo(192, i + .5); g.stroke(); }
  g.strokeStyle = "rgba(60,40,30,.03)";
  for (let i = 12; i < 192; i += 12) { if (i % 48 === 0) continue; g.beginPath(); g.moveTo(i + .5, 0); g.lineTo(i + .5, 192); g.moveTo(0, i + .5); g.lineTo(192, i + .5); g.stroke(); }
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${r() < .5 ? "70,50,40" : "255,255,255"},${.03 + r() * .06})`; g.fillRect(r() * 192, r() * 192, 1 + r() * 1.4, 1 + r() * 1.4); }
  return c;
})();
const grainPattern = ctx.createPattern(grainTile, "repeat");

let sealCanvas = null, cardLight = null, cardDark = null;
const DISPLAY = '800 {s}px "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif';
const MONO = '500 {s}px "DM Mono", ui-monospace, Menlo, monospace';
const font = (tpl, s) => tpl.replace("{s}", s);

function superellipse(g, r, n, jitter, rr) {
  g.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * TAU, c = Math.cos(a), s = Math.sin(a);
    const k = r * (1 + (rr() - .5) * jitter);
    g.lineTo(Math.sign(c) * Math.pow(Math.abs(c), 2 / n) * k, Math.sign(s) * Math.pow(Math.abs(s), 2 / n) * k);
  }
  g.closePath();
}
function buildSeal() {
  const c = makeCanvas(360, 360), g = c.getContext("2d"), r = rng(42);
  g.translate(180, 180); g.rotate(-3 * DEG);
  g.fillStyle = "#d8391b";
  superellipse(g, 150, 7, .025, r); g.fill();
  g.globalCompositeOperation = "destination-out";
  g.lineWidth = 7; superellipse(g, 128, 7, .012, r); g.stroke();
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#000";
  g.font = font(DISPLAY, 106);
  g.fillText("残", 0, -52); g.fillText("心", 0, 58);
  for (let i = 0; i < 700; i++) {
    const a = r() * TAU, d = Math.pow(r(), .6) * 160;
    g.globalAlpha = .35 + r() * .65; g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, .4 + r() * 2.2, 0, TAU); g.fill();
  }
  g.globalAlpha = .25; g.lineWidth = 1.2;
  for (let i = 0; i < 14; i++) { const y = -150 + r() * 300; g.beginPath(); g.moveTo(-160, y); g.lineTo(160, y + (r() - .5) * 30); g.stroke(); }
  sealCanvas = c;
}
function buildCard(dark) {
  const s = 2, c = makeCanvas(600 * s, 230 * s), g = c.getContext("2d");
  g.scale(s, s);
  const fg = dark ? "#f3ede4" : "#151114";
  g.fillStyle = fg; g.textBaseline = "alphabetic";
  g.font = font(DISPLAY, 78); g.fillText("焔月", 0, 76);
  g.font = font(MONO, 14); g.fillText("EMBER MOON", 182, 38);
  g.globalAlpha = .6; g.font = font(MONO, 12); g.fillText("NO.07 — IAI STUDY", 182, 60); g.globalAlpha = 1;
  g.fillStyle = dark ? "#1b1213" : "#151114"; g.fillRect(0, 96, 296, 60);
  if (dark) { g.strokeStyle = "#de381a"; g.lineWidth = 1.5; g.strokeRect(.75, 96.75, 294.5, 58.5); }
  g.fillStyle = "#e8401c"; g.font = font(DISPLAY, 38); g.fillText("居合・月裂", 16, 140);
  for (let i = 0; i < 4; i++) { g.globalAlpha = i % 2 ? .45 : 1; g.fillRect(308 + i * 13, 134, 7, 7); }
  g.globalAlpha = .55; g.fillStyle = fg; g.font = font(MONO, 11); g.fillText("IAIJUTSU · LUNAR REND · 14.6 SEC · 24 FPS", 0, 184);
  return c;
}
function buildAssets() { buildSeal(); cardLight = buildCard(false); cardDark = buildCard(true); }
buildAssets();
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load(font(DISPLAY, 80), "焔月居合・裂残心零静壱抜刀弐一閃参眼肆渦伍納陸"),
    document.fonts.load(font(MONO, 14), "EMBER MOON 0123")
  ]).then(buildAssets, () => {});
}

/* ---------- geometry helpers ---------- */
const cvz = x => 0.00007 * ((x + 200) * (x + 200) - 40000);
const placeMid = (cx, cy, a, s, mid) => ({ x: cx - Math.cos(a) * mid * s, y: cy - Math.sin(a) * mid * s, a, s });
const shiftT = (T0, d) => ({ x: T0.x + Math.cos(T0.a) * d * T0.s, y: T0.y + Math.sin(T0.a) * d * T0.s, a: T0.a, s: T0.s });
const lerpT = (A, B, p) => ({ x: lerp(A.x, B.x, p), y: lerp(A.y, B.y, p), a: lerp(A.a, B.a, p), s: lerp(A.s, B.s, p) });
const worldPt = (T0, lx, ly) => { const c = Math.cos(T0.a), s = Math.sin(T0.a); return { x: T0.x + (c * lx - s * ly) * T0.s, y: T0.y + (s * lx + c * ly) * T0.s }; };
const applyT = T0 => { ctx.translate(T0.x, T0.y); ctx.rotate(T0.a); ctx.scale(T0.s, T0.s); };

function band(x0, x1, w0, w1, n = 28, off = 0) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const u = i / n, x = lerp(x0, x1, u); ctx.lineTo(x, cvz(x) - lerp(w0, w1, u) + off); }
  for (let i = n; i >= 0; i--) { const u = i / n, x = lerp(x0, x1, u); ctx.lineTo(x, cvz(x) + lerp(w0, w1, u) + off); }
  ctx.closePath();
}
function curveLine(x0, x1, off, n = 28) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const x = lerp(x0, x1, i / n); ctx.lineTo(x, cvz(x) + off); }
}
function goldFill(y0, y1) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "#fbe29a"); g.addColorStop(.35, "#d9a441"); g.addColorStop(.7, "#93621f"); g.addColorStop(1, "#4a2e0c");
  return g;
}
function taperArc(cx, cy, r, a1, a2, w, n = 40) {
  if (Math.abs(a2 - a1) < 1e-3) return;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const u = i / n, a = lerp(a1, a2, u), ww = w * .5 * Math.min(1, u * 6) * Math.min(1, (1 - u) * 2.5); ctx.lineTo(cx + Math.cos(a) * (r + ww), cy + Math.sin(a) * (r + ww)); }
  for (let i = n; i >= 0; i--) { const u = i / n, a = lerp(a1, a2, u), ww = w * .5 * Math.min(1, u * 6) * Math.min(1, (1 - u) * 2.5); ctx.lineTo(cx + Math.cos(a) * (r - ww), cy + Math.sin(a) * (r - ww)); }
  ctx.closePath(); ctx.fill();
}
function taperLine(pts, w, head = .3, tail = .5) {
  const n = pts.length; if (n < 2) return;
  const A = [], B = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[Math.min(n - 1, i + 1)], o = pts[Math.max(0, i - 1)];
    let dx = q[0] - o[0], dy = q[1] - o[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const u = i / (n - 1), ww = w * .5 * Math.min(1, u / tail) * Math.min(1, (1 - u) / head);
    A.push([p[0] - dy * ww, p[1] + dx * ww]); B.push([p[0] + dy * ww, p[1] - dx * ww]);
  }
  ctx.beginPath(); for (const p of A) ctx.lineTo(p[0], p[1]); for (let i = n - 1; i >= 0; i--) ctx.lineTo(B[i][0], B[i][1]); ctx.closePath(); ctx.fill();
}
function halftone(cx, cy, R, sp, maxr, fn, ry = R) {
  ctx.beginPath();
  for (let y = Math.floor((cy - ry) / sp) * sp; y <= cy + ry; y += sp) {
    const odd = (Math.round(y / sp) & 1) ? sp / 2 : 0;
    for (let x = Math.floor((cx - R) / sp) * sp + odd; x <= cx + R; x += sp) {
      const d = Math.hypot(x - cx, y - cy) / R; if (d > 1) continue;
      const k = fn(d, x, y); if (k <= .03) continue;
      const r = maxr * Math.min(1.15, k); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
    }
  }
  ctx.fill();
}
function lens(L, h, q, amp, top = 1.05, bot = .85) {
  const N = 96, p = new Path2D(), pts = [];
  for (let i = 0; i <= N; i++) {
    const u = -1 + 2 * i / N, env = Math.pow(1 - u * u, 1.25), x = u * L / 2;
    pts.push([x, -h * env * top + noise1(i * .9 + q * 13.7) * amp * Math.sqrt(env)]);
  }
  for (let i = N; i >= 0; i--) {
    const u = -1 + 2 * i / N, env = Math.pow(1 - u * u, 1.25), x = u * L / 2;
    pts.push([x, h * env * bot + noise1(i * 1.3 + q * 7.1 + 40) * amp * Math.sqrt(env)]);
  }
  pts.forEach((pt, i) => i ? p.lineTo(pt[0], pt[1]) : p.moveTo(pt[0], pt[1]));
  p.closePath();
  return p;
}
function glowStroke(path, layers, scale = 1) {
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineJoin = "round"; ctx.lineCap = "round";
  for (const [w, a, col] of layers) { ctx.lineWidth = w * scale; ctx.strokeStyle = rgba(col, a); ctx.stroke(path); }
  ctx.restore();
}
const EDGE_GLOW = [[54, .05, C.ember], [30, .12, C.ember], [14, .32, [255, 150, 60]], [6, .75, [255, 206, 140]], [2.2, 1, [255, 248, 235]]];

/* ---------- katana ---------- */
const sayaStreaks = (() => {
  const r = rng(11), out = [];
  for (let i = 0; i < 9; i++) {
    const x0 = -590 + r() * 520, len = 30 + r() * 110, y0 = (r() - .5) * 18, pts = [];
    let y = y0;
    for (let k = 0; k <= 5; k++) { y += (r() - .5) * 6; pts.push([x0 + len * k / 5, clamp(y, -12, 12)]); }
    out.push(pts);
  }
  return out;
})();
const hamon = Array.from({ length: 60 }, (_, i) => noise1(i * .55 + 3) * 2.6);

function drawBlade(gleam, D) {
  const b0 = -10, ky = -584, tip = -624;
  const spine = x => cvz(x) + lerp(10, 8.2, (b0 - x) / (b0 - ky));
  const edge = x => cvz(x) - lerp(10.5, 8.8, (b0 - x) / (b0 - ky));
  const path = new Path2D();
  for (let i = 0; i <= 40; i++) { const x = lerp(b0, ky, i / 40); i ? path.lineTo(x, spine(x)) : path.moveTo(x, spine(x)); }
  path.quadraticCurveTo(tip + 10, cvz(tip) + 8, tip, cvz(tip) - 4);
  path.quadraticCurveTo(tip + 18, cvz(tip) - 9.5, ky, edge(ky));
  for (let i = 40; i >= 0; i--) { const x = lerp(b0, ky, i / 40); path.lineTo(x, edge(x)); }
  path.closePath();
  const g = ctx.createLinearGradient(0, -12, 0, 12);
  g.addColorStop(0, "#fbfdff"); g.addColorStop(.3, "#e2e7ec"); g.addColorStop(.5, "#a9b1ba"); g.addColorStop(.62, "#7d8691"); g.addColorStop(1, "#3f4650");
  ctx.fillStyle = g; ctx.fill(path);
  ctx.save(); ctx.clip(path);
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2.2;
  ctx.beginPath();
  for (let i = 0; i <= 59; i++) { const x = lerp(b0, ky, i / 59); ctx.lineTo(x, cvz(x) - 3.5 + hamon[i]); }
  ctx.stroke();
  ctx.strokeStyle = "rgba(30,34,40,.55)"; ctx.lineWidth = 1; curveLine(b0, ky, 3.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ky, edge(ky)); ctx.lineTo(ky + 2, spine(ky)); ctx.stroke();
  if (gleam >= 0 && gleam <= 1) {
    const gx = lerp(b0 + 60, tip - 60, gleam);
    const gg = ctx.createLinearGradient(gx - 70, 0, gx + 70, 0);
    gg.addColorStop(0, "rgba(255,255,255,0)"); gg.addColorStop(.5, "rgba(255,255,255,.95)"); gg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gg; ctx.fillRect(gx - 70, -20, 140, 40);
  }

    drawSeal(t);
  });
}
function withCam(t, sh, fn) {
  const cm = camAt(t);
  ctx.save();
  ctx.translate(960 + sh[0], 540 + sh[1]); ctx.rotate(cm.r); ctx.scale(cm.z, cm.z); ctx.translate(-cm.cx, -cm.cy);
  fn(cm);
  ctx.restore();
}
function drawWipe(t, sh, st) {
  const p = seg(t, 9.95, 10.6);
  ctx.fillStyle = rgba(C.night); ctx.fillRect(-W, -H, W * 3, H * 3);
  ctx.fillStyle = rgba(C.verm, .92);
  ctx.beginPath();
  for (let y = -20; y < H + 30; y += 26) for (let x = -20; x < W + 30; x += 26) {
    const v = (noise2(x * .004 + 3, y * .004) - .5) * 4.5 * (1 - p * .4);
    if (v <= 0) continue; const r = Math.min(1, v) * 12.5; ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU);
  }
  ctx.fill();
  ctx.save(); ctx.beginPath();
  const sp = 34;
  for (let y = -sp; y < H + sp * 2; y += sp) for (let x = -sp; x < W + sp * 2; x += sp) {
    const delay = clamp(Math.hypot(x - 960, y - 540) / 1100 * .65 + noise2(x * .003, y * .003) * .5);
    const k = clamp((p * 1.75 - delay * .95) / .45), r = k * sp * .76;
    if (r > .5) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
  }
  ctx.clip();
  paperScene(t, sh, st);
  ctx.restore();
}
function drawSplats(t) {
  for (const s of splats) {
    const pin = seg(t, s.t0, s.t0 + .16), pout = seg(t, 10.5, 10.95);
    if (pin <= 0 || pout >= 1) continue;
    const r = s.r * E.outB(pin) * (1 - E.inC(pout));
    if (r > .5) splat(s.x, s.y, r, s.seed, s.red ? rgba(C.verm, .95) : rgba(C.ink, .96));
  }
}
let introStart = performance.now();
function drawTitle(t, D) {
  if (!cardLight) return;
  const intro = clamp((performance.now() - introStart) / 450);
  let v = 0;
  if (t < 3.15) v = 1; else if (t < 3.4) v = 1 - seg(t, 3.15, 3.4); else if (t >= 13.4) v = seg(t, 13.4, 13.75);
  v = Math.min(v, intro);
  if (v <= 0) return;
  const cw = 600, chh = 230, x = 64, y = 54;
  const q = Math.floor(t * 30) + Math.floor(performance.now() / 33), r = rng(q);
  const slices = 10;
  for (let i = 0; i < slices; i++) {
    if (v < 1 && r() > v + .15) continue;
    const off = v < 1 ? (r() - .5) * 60 * (1 - v) : 0, sy = i * chh / slices;
    for (const [img, a] of [[cardLight, 1 - D], [cardDark, D]]) {

function chapterAt(t) { let c = CHAPTERS[0]; for (const ch of CHAPTERS) if (t >= ch[0]) c = ch; return c; }
function drawHUD(t, D) {
  const ch = chapterAt(t), fg = mix([30, 24, 26], [243, 237, 228], D);
  const fresh = seg(t, ch[0], ch[0] + .35);
  ctx.save(); ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  ctx.globalAlpha = .82 * (.4 + .6 * fresh);
  ctx.fillStyle = rgba(fg); ctx.font = font(DISPLAY, 34); ctx.fillText(ch[1], W - 64, 92);
  ctx.font = font(MONO, 13); ctx.fillText(`${ch[2]} · ${ch[3]}`, W - 64, 118);
  ctx.globalAlpha = .55; ctx.font = font(MONO, 12);
  const f = Math.floor(t * FPS), sec = Math.floor(t), fr = f % FPS;
  ctx.fillText(`TC 00:${String(sec).padStart(2, "0")}:${String(fr).padStart(2, "0")} · F${String(f).padStart(3, "0")}`, W - 64, 140);
  ctx.fillStyle = rgba(C.verm); ctx.globalAlpha = .9; ctx.fillRect(W - 64 - 120 * (t / T), 152, 120 * (t / T), 2);
  ctx.globalAlpha = .2; ctx.fillStyle = rgba(fg); ctx.fillRect(W - 184, 152, 120, 2);
  ctx.restore();
}
function drawFlashOverlay(t) {
  for (const [ti, A, col] of FLASHES) {
    if (t < ti) continue;
    const a = A * Math.exp(-(t - ti) * 9) * (RM ? .4 : 1);
    if (a < .01) continue;
    ctx.fillStyle = rgba(col, a); ctx.fillRect(-W, -H, W * 3, H * 3);
  }
}

/* ---------- frame ---------- */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * fit, 0, 0, dpr * fit, dpr * ox, dpr * oy);
  const D = darkAt(t), sh = shakeAt(t), st = swordState(t);
  if (t < 9.95) {
    drawBG(D, t);
    withCam(t, sh, () => {
      ambientGlow(t, D);
      const early = 1 - seg(t, 3.45, 3.72);
      if (t < 3.75) {
        drawSplitRing(t, D, early);
        drawOrbits(t, D, early);
        drawSwooshes(t);
        if (st.alpha) {
          drawSword(st, t, D);
          const F = worldPt(st.sheath, -14, 0);
          drawSparks(t, D, F);
          drawFlash(t, F, st.sheath.a);
        }
        drawSmear(t);
      }
      drawRift(t);
      drawCrossSlashes(t);
      const eye = { x: SL.x, y: SL.y };
      drawEmbers(t, seg(t, 1.6, 2.2) * (t < 3.6 ? 1 : seg(t, 4.0, 4.4)), eye);
    });
    drawSpeedLines(t);
  } else if (t < 10.6) {
    drawWipe(t, sh, st);
    withCam(t, sh, () => drawSplats(t));
  } else {
    paperScene(t, sh, st);
    if (t < 11) withCam(t, sh, () => drawSplats(t));
  }
  drawFlashOverlay(t);
  drawTitle(t, t < 9.95 ? D : 0);
  drawHUD(t, t < 9.95 ? D : 0);
}

/* ---------- audio ---------- */
let AC = null, OUT = null, NB = null, soundOn = false;
function ensureAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 6;
    OUT = AC.createGain(); OUT.gain.value = .85; OUT.connect(comp); comp.connect(AC.destination);
    NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return AC.resume();
}
function env(g, t0, a, peak, dur) { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + Math.max(dur, a + .01)); }
function nz({ dur = .5, type = "bandpass", f0 = 1000, f1 = f0, q = 1, g = .3, a = .005, delay = 0 }) {
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(); s.buffer = NB; s.loop = true;
  const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const gn = AC.createGain(); env(gn, t0, a, g, dur);
  s.connect(f); f.connect(gn); gn.connect(OUT); s.start(t0, Math.random() * 1.5); s.stop(t0 + dur + .05);
}
function tn({ f0 = 440, f1 = f0, dur = .5, type = "sine", g = .2, a = .005, delay = 0 }) {
  const t0 = AC.currentTime + delay, o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const gn = AC.createGain(); env(gn, t0, a, g, dur);
  o.connect(gn); gn.connect(OUT); o.start(t0); o.stop(t0 + dur + .05);
}
const SFX = {
  draw() { nz({ dur: .35, f0: 7000, f1: 3000, q: 3, g: .25 }); [2380, 3530, 5210, 7400].forEach((f, i) => tn({ f0: f, f1: f * .995, dur: 1.4 - i * .2, g: .045, a: .002 })); nz({ dur: .5, type: "lowpass", f0: 300, f1: 2400, q: .7, g: .2, a: .12 }); },
  whoosh() { nz({ dur: .35, f0: 400, f1: 3000, q: 1.2, g: .35, a: .15 }); },
  slash() { nz({ dur: .25, type: "highpass", f0: 2000, f1: 8000, q: .7, g: .4, a: .01 }); tn({ f0: 110, f1: 28, dur: 1.1, g: .7 }); nz({ dur: 1.2, type: "lowpass", f0: 900, f1: 60, q: .5, g: .5 }); },
  tear() { nz({ dur: .9, f0: 1500, f1: 300, q: .8, g: .35, a: .02 }); tn({ f0: 70, f1: 35, dur: 1.6, type: "triangle", g: .45 }); for (let i = 0; i < 6; i++) nz({ dur: .05, type: "highpass", f0: 4000, g: .22, delay: Math.random() * .6 }); },
  drone() { tn({ f0: 41, f1: 39, dur: 3.4, type: "triangle", g: .22, a: .8 }); tn({ f0: 61.5, f1: 60, dur: 3.4, type: "triangle", g: .14, a: .8 }); },
  beat() { tn({ f0: 75, f1: 38, dur: .3, g: .6 }); tn({ f0: 70, f1: 36, dur: .3, g: .45, delay: .22 }); },
  vortex() { nz({ dur: 1.25, f0: 180, f1: 3200, q: 2.5, g: .35, a: 1.0 }); tn({ f0: 55, f1: 110, dur: 1.25, type: "triangle", g: .25, a: 1 }); },
  cut() { nz({ dur: .18, type: "highpass", f0: 3000, f1: 9000, g: .35 }); tn({ f0: 180, f1: 60, dur: .25, g: .3 }); },
  impact() { tn({ f0: 90, f1: 25, dur: 1.6, g: .9 }); nz({ dur: 1.4, type: "lowpass", f0: 3000, f1: 80, q: .4, g: .6, a: .003 }); },
  splat() { nz({ dur: .12, type: "lowpass", f0: 1200, f1: 200, g: .4, a: .003 }); },
  click() { tn({ f0: 2600, f1: 2500, dur: .25, type: "triangle", g: .12, a: .001 }); nz({ dur: .04, type: "highpass", f0: 3000, g: .4, a: .001 }); tn({ f0: 3900, f1: 3880, dur: .5, g: .05, a: .001 }); },
  stamp() { tn({ f0: 130, f1: 45, dur: .3, g: .6 }); nz({ dur: .15, type: "lowpass", f0: 800, f1: 150, g: .4, a: .002 }); }
};
const EVENTS = [[.93, "draw"], [3.03, "whoosh"], [3.24, "slash"], [4.0, "tear"], [4.5, "drone"], [5.42, "beat"], [6.32, "beat"], [7.15, "beat"], [8.0, "vortex"], [9.32, "cut"], [9.47, "cut"], [9.6, "cut"], [9.88, "impact"], [10.05, "splat"], [10.22, "splat"], [11.5, "whoosh"], [12.05, "click"], [13.36, "stamp"]];
function fire(prev, now, wrapped) {
  for (const [te, name] of EVENTS) {
    const hit = wrapped ? (te > prev || te <= now) : (te > prev && te <= now);
    if (hit) SFX[name]();
  }
}

/* ---------- transport ---------- */
let t = 0, playing = !RM, speed = 1, last = performance.now();
const $ = id => document.getElementById(id);
const scrub = $("scrub"), tc = $("tc"), playBtn = $("play"), speedBtn = $("speed"), soundBtn = $("sound");
const ICON_PLAY = '<path d="M7 5v14l12-7z"/>', ICON_PAUSE = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
const ICON_SOUND_ON = '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
const ICON_SOUND_OFF = $("soundIcon").innerHTML;
CHAPTERS.slice(1).forEach(([ts, num, ja, en]) => { const s = document.createElement("span"); s.style.left = (ts / T * 100) + "%"; s.title = `${num} ${ja} · ${en}`; $("ticks").appendChild(s); });
function setPlaying(p) {
  playing = p; playBtn.setAttribute("aria-label", p ? "Pause" : "Play");
  $("playIcon").innerHTML = p ? ICON_PAUSE : ICON_PLAY;
  if (!p) document.body.classList.remove("idle"); else poke();
}
playBtn.addEventListener("click", () => setPlaying(!playing));
$("restart").addEventListener("click", () => { t = 0; introStart = performance.now(); setPlaying(true); });
speedBtn.addEventListener("click", () => { speed = speed === 1 ? .5 : speed === .5 ? .25 : 1; speedBtn.textContent = speed === 1 ? "1×" : speed === .5 ? "½×" : "¼×"; });
soundBtn.addEventListener("click", async () => {
  soundOn = !soundOn;
  soundBtn.setAttribute("aria-pressed", String(soundOn));
  $("soundIcon").innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
  if (soundOn) { try { await ensureAudio(); } catch (e) { soundOn = false; soundBtn.setAttribute("aria-pressed", "false"); $("soundIcon").innerHTML = ICON_SOUND_OFF; } }
});
scrub.addEventListener("input", () => { t = scrub.value / 1000; });
cv.addEventListener("click", () => { if (!playing) setPlaying(true); else { t = 0; introStart = performance.now(); } });
addEventListener("keydown", e => {
  if (e.target === scrub && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
  if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "r" || e.key === "R") { t = 0; introStart = performance.now(); }
  else if (e.key === "m" || e.key === "M") soundBtn.click();
  else if (e.key === "ArrowRight" || e.key === ".") { setPlaying(false); t = Math.min(T - .001, t + 1 / FPS); }
  else if (e.key === "ArrowLeft" || e.key === ",") { setPlaying(false); t = Math.max(0, t - 1 / FPS); }
  poke();
});
let idleTimer = 0;
function poke() { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2400); }
addEventListener("pointermove", poke); addEventListener("pointerdown", poke);
poke();
setPlaying(playing);

function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (playing) {
    const prev = t; t += dt * speed; let wrapped = false;
    if (t >= T) { t -= T; wrapped = true; }
    if (soundOn && AC && speed === 1) fire(prev, t, wrapped);
  }
  render(t);
  if (document.activeElement !== scrub) scrub.value = Math.round(t * 1000);
  scrub.style.setProperty("--p", (t / T * 100) + "%");
  const f = Math.floor(t * FPS);
  tc.textContent = `00:${String(Math.floor(t)).padStart(2, "0")}:${String(f % FPS).padStart(2, "0")}`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
